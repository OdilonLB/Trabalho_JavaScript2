<script>
    function maiorEntreTres(a, b, c) {
    if (a >= b && a >= c) {
        return a;
    } else if (b >= a && b >= c) {
        return b;
    } else {
        return c;
    }
}

console.log(maiorEntreTres(12, 20, 22));
console.log(maiorEntreTres(50, 60, 70));
console.log(maiorEntreTres(100, 120, 100));    
</script>
