<script>
    function somarTudo(...numeros) {
    let soma = 0;
    
    for (let numero of numeros) {
        soma += numero;
    }
    
    return soma;
}

console.log(somarTudo(12, 22, 2));             
console.log(somarTudo(20, 20, 13, 32, 55));  
console.log(somarTudo(5));                   
console.log(somarTudo());                    
</script>
