<script>
    function quadrado(numero) {
    return numero * numero;
}

console.log(quadrado(5));

    const quadradoArrow = (numero) => {
    return numero * numero;
};

const quadradoArrowCurta = numero => numero * numero;

console.log(quadradoArrow(4));
console.log(quadradoArrowCurta(4));
</script>
